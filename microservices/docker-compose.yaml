
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  doctor-service:
    build: ./doctor-service
    container_name: doctor-service
    ports:
      - "8081:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - PORT=:8080
    depends_on:
      - mongodb

  appoitment-service:
    build: ./appoitment-service
    container_name: appoitment-service
    ports:
      - "8082:8080"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - PORT=:8080
      - DOCTOR_SERVICE_URL=http://doctor-service:8080 
    depends_on:
      - mongodb
      - doctor-service

volumes:
  mongo-data: